<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLCKT</title>
    <link rel="manifest" href="./manifest.json" />
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@23.1.1/dist/tween.umd.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="info">
      <div id="start-message">
        <p>Click to Start</p>
      </div>
      <div id="score-container">Score: <span id="score">0</span></div>
      <div id="game-over">
        GAME OVER<br /><small>(click/tap/<code>space</code> to restart)</small>
      </div>
    </div>
    <div id="pause-menu">
      <h2>PAUSED</h2>
      <div class="controls-container">
        <div class="controls-section">
          <h3>Standard Controls</h3>
          <p><b>Arrows:</b> Move</p>
          <p><b>Shift + Arrows:</b> Rotate</p>
          <p><b>Z:</b> Spin piece</p>
          <p><b>Space:</b> Hard Drop</p>
        </div>
        <div class="controls-section">
          <h3>Colemak Controls</h3>
          <p><b>N, O, I, E:</b> Move</p>
          <p><b>A + Keys:</b> Rotate</p>
          <p><b>R:</b> Spin Piece</p>
        </div>
      </div>
      <p><small>(ESC or click score to resume)</small></p>
    </div>
    <canvas id="bg"></canvas>
    <script type="module" src="blckt.js"></script>
  </body>
</html>
