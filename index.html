<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLCKT</title>
    <link rel="manifest" href="./manifest.json" />
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@23.1.1/dist/tween.umd.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #333;

        /* Prevent zooming and scrolling */
        touch-action: none;

        /* Disable text selection */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;

        /* Disable callout menu on long-press (iOS) */
        -webkit-touch-callout: none;

        /* Remove the highlight color on tap */
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: #93a1a1; /* Solarized Base1 */
        font-family: monospace;
        font-size: 24px;
        text-shadow: 1px 1px 2px #000;
        z-index: 100;
      }
      #game-over {
        display: none;
        color: #dc322f;
        cursor: pointer; /* Make it look clickable */
      }
    </style>
  </head>
  <body>
    <div id="info">
      <div id="start-message">
        <p>Click to Start</p>
      </div>
      <div>Score: <span id="score">0</span></div>
      <div id="game-over">GAME OVER<br /><small>(click to restart)</small></div>
    </div>
    <canvas id="bg"></canvas>
    <script type="module" src="blckt.js"></script>
  </body>
</html>
